<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" font-family="Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <rect width="960" height="240" fill="#ffffff"/>
  <text x="480" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#1b2a33">StateSpaceForecast の考え方（カルマンフィルター、概念図）</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1b2a33"/></marker></defs>
  <rect x="40" y="60" width="240" height="110" rx="8" fill="#e8f1f8" stroke="#1b5e8a"/>
  <text x="160" y="88" font-size="15" font-weight="700" text-anchor="middle" fill="#1b5e8a">隠れた「状態」</text>
  <text x="160" y="112" font-size="12.5" text-anchor="middle" fill="#1b2a33">いまの水準</text>
  <text x="160" y="132" font-size="12.5" text-anchor="middle" fill="#1b2a33">1日周期のパターン（period=48）</text>
  <text x="160" y="152" font-size="12.5" text-anchor="middle" fill="#1b2a33">それぞれの不確かさ</text>
  <rect x="360" y="60" width="240" height="110" rx="8" fill="#f3eaf7" stroke="#6a2c8a"/>
  <text x="480" y="92" font-size="15" font-weight="700" text-anchor="middle" fill="#6a2c8a">① 予測する</text>
  <text x="480" y="118" font-size="12.5" text-anchor="middle" fill="#1b2a33">状態から次の30分の値と</text>
  <text x="480" y="138" font-size="12.5" text-anchor="middle" fill="#1b2a33">予測の幅（95%区間）を出す</text>
  <rect x="680" y="60" width="240" height="110" rx="8" fill="#fff4e0" stroke="#a86400"/>
  <text x="800" y="92" font-size="15" font-weight="700" text-anchor="middle" fill="#a86400">② 実測で更新する</text>
  <text x="800" y="118" font-size="12.5" text-anchor="middle" fill="#1b2a33">外れた分だけ状態を修正。</text>
  <text x="800" y="138" font-size="12.5" text-anchor="middle" fill="#1b2a33">実測が欠けていれば予測で埋める</text>
  <line x1="280" y1="115" x2="356" y2="115" stroke="#1b2a33" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="115" x2="676" y2="115" stroke="#1b2a33" stroke-width="2" marker-end="url(#a)"/>
  <path d="M800,170 C800,198 160,198 160,174" fill="none" stroke="#1b2a33" stroke-width="2" marker-end="url(#a)"/>
  <text x="480" y="228" font-size="12.5" text-anchor="middle" fill="#5b6b75">学習データの各時点でこれを繰り返す。データが尽きたら（holdback と未来）①だけを続けて先を予測する</text>
</svg>
